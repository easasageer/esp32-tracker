<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 GPS Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    h1 { padding: 15px; margin: 0; }

    #status { padding: 10px; font-size: 18px; }

    #map { height: 70vh; width: 100%; }

    .details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 15px;
    }

    .box {
      background: #222;
      padding: 12px;
      border-radius: 8px;
    }

    .label { font-size: 13px; color: #aaa; }

    .value {
      font-size: 18px;
      font-weight: bold;
      margin-top: 5px;
    }

    #googleMaps {
      display: inline-block;
      margin: 15px;
      padding: 12px 20px;
      background: #4285F4;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    #googleMaps:hover { opacity: 0.85; }
  </style>
</head>

<body>
  <h1>📍 ESP32 GPS Tracker</h1>

  <div id="status">Connecting to ThingsBoard...</div>
  <div id="map"></div>

  <div class="details">
    <div class="box">
      <div class="label">Status</div>
      <div class="value" id="gpsStatus">--</div>
    </div>

    <div class="box">
      <div class="label">Speed</div>
      <div class="value" id="speed">--</div>
    </div>

    <div class="box">
      <div class="label">Satellites</div>
      <div class="value" id="satellites">--</div>
    </div>

    <div class="box">
      <div class="label">Latitude</div>
      <div class="value" id="latitude">--</div>
    </div>

    <div class="box">
      <div class="label">Longitude</div>
      <div class="value" id="longitude">--</div>
    </div>

    <div class="box">
      <div class="label">Last Update</div>
      <div class="value" id="updateTime">--</div>
    </div>
  </div>

  <a id="googleMaps" href="#" target="_blank" rel="noopener">
    Open in Google Maps
  </a>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // =============================================

    // =============================================

    const API_KEY = "tb_5JMVOnpyfr-zVABN4_11pylL_mMhxZaE5U66M9gLLab2PVUGe8EfpF8v67s5B9rj96ieYRLMVdVP-uWgqtmRdg";

    // =============================================
    // GPS FILTER SETTINGS
    // =============================================

    const MIN_MOVEMENT_METERS = 2;
    const MAX_SPEED_KMPH = 120;
    const STATIONARY_SPEED_KMPH = 3;

    // =============================================
    // MAP
    // =============================================

    const map = L.map("map").setView([10.156453, 76.258558], 15);

    const osmTiles = L.tileLayer(
      "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
      }
    );

    const esriTiles = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
      {
        maxZoom: 19,
        attribution: "Tiles &copy; Esri"
      }
    );

    let usingFallbackTiles = false;
    let tileErrorCount = 0;

    osmTiles.on("tileerror", function () {
      tileErrorCount++;

      if (tileErrorCount >= 3 && !usingFallbackTiles) {
        usingFallbackTiles = true;
        map.removeLayer(osmTiles);
        esriTiles.addTo(map);
        document.getElementById("status").textContent =
          "OpenStreetMap failed; trying backup map...";
      }
    });

    esriTiles.on("tileerror", function () {
      document.getElementById("status").textContent =
        "Map tiles unavailable. Check your internet connection.";
    });

    osmTiles.addTo(map);

    window.addEventListener("load", function () {
      setTimeout(function () {
        map.invalidateSize();
      }, 250);
    });

    // =============================================
    // GPS MARKER AND STRAIGHT ROUTE LINE
    // =============================================

    let marker = null;
    let firstLocation = true;

    const routeLine = L.polyline([], {
      color: "#00aaff",
      weight: 5,
      opacity: 0.9
    }).addTo(map);

    // =============================================
    // DISTANCE CALCULATION
    // =============================================

    function distanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;

      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;

      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) ** 2;

      return R * 2 * Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
      );
    }
