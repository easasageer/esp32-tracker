<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ESP32 GPS Tracker</title>


  <!-- Leaflet -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >


  <style>

    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: #111;

      color: white;

      text-align: center;

    }


    h1 {

      padding: 15px;

      margin: 0;

    }


    #status {

      padding: 10px;

      font-size: 18px;

    }


    #map {

      height: 70vh;

      width: 100%;

    }


    .details {

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 10px;

      padding: 15px;

    }


    .box {

      background: #222;

      padding: 12px;

      border-radius: 8px;

    }


    .label {

      font-size: 13px;

      color: #aaa;

    }


    .value {

      font-size: 18px;

      font-weight: bold;

      margin-top: 5px;

    }


    #googleMaps {

      display: inline-block;

      margin: 15px;

      padding: 12px 20px;

      background: #4285F4;

      color: white;

      text-decoration: none;

      border-radius: 8px;

      font-weight: bold;

    }


    #googleMaps:hover {

      opacity: 0.85;

    }

  </style>

</head>


<body>


  <h1>📍 ESP32 GPS Tracker</h1>


  <div id="status">

    Connecting to ThingsBoard...

  </div>


  <div id="map"></div>


  <div class="details">


    <div class="box">

      <div class="label">
        Status
      </div>

      <div
        class="value"
        id="gpsStatus"
      >
        --
      </div>

    </div>


    <div class="box">

      <div class="label">
        Speed
      </div>

      <div
        class="value"
        id="speed"
      >
        --
      </div>

    </div>


    <div class="box">

      <div class="label">
        Satellites
      </div>

      <div
        class="value"
        id="satellites"
      >
        --
      </div>

    </div>


    <div class="box">

      <div class="label">
        Latitude
      </div>

      <div
        class="value"
        id="latitude"
      >
        --
      </div>

    </div>


    <div class="box">

      <div class="label">
        Longitude
      </div>

      <div
        class="value"
        id="longitude"
      >
        --
      </div>

    </div>


    <div class="box">

      <div class="label">
        Last Update
      </div>

      <div
        class="value"
        id="updateTime"
      >
        --
      </div>

    </div>

  </div>


  <a
    id="googleMaps"
    href="#"
    target="_blank"
  >
    Open in Google Maps
  </a>


  <!-- Leaflet -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>


  <script>


    // =====================================================
    // THINGSBOARD SETTINGS
    // =====================================================


    const THINGSBOARD_URL =
      "https://thingsboard.cloud";


    const DEVICE_ID =
      "512351b0-b9be-11f1-8553-d97f9e4a8828";


    // =====================================================
    // PUT YOUR NEW API KEY HERE
    // =====================================================

    // Paste a NEWLY REGENERATED ThingsBoard API key here.
    // The key in the uploaded file was exposed, so revoke/rotate it first.
    const API_KEY =
      "tb_5JMVOnpyfr-zVABN4_11pylL_mMhxZaE5U66M9gLLab2PVUGe8EfpF8v67s5B9rj96ieYRLMVdVP-uWgqtmRdg";


    // =====================================================
    // GPS FILTER SETTINGS
    // =====================================================

    // Ignore GPS movement smaller than this distance
    // when building the route.

    const MIN_MOVEMENT_METERS = 2;


    // Ignore impossible GPS jumps.

    const MAX_SPEED_KMPH = 120;


    // Display anything below this as 0 km/h.

    const STATIONARY_SPEED_KMPH = 3;


    // =====================================================
    // MAP
    // =====================================================


    const map =
      L.map("map")
        .setView(
          [10.156453, 76.258558],
          15
        );


    L.tileLayer(

      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

      {

        maxZoom: 19,

        attribution:
          "&copy; OpenStreetMap contributors"

      }

    ).addTo(map);


    // =====================================================
    // GPS MARKER
    // =====================================================


    let marker = null;


    // =====================================================
    // ROUTE LINE
    // =====================================================


    let routeLine =
      L.polyline(
        [],
        {
          weight: 5
        }
      ).addTo(map);


    let firstLocation = true;

    // OSRM road matching state. We road-match only the newest
    // 100 cleaned points to avoid excessive requests to the public demo service.
    let lastMatchedLatestTs = 0;
    let lastMatchAt = 0;
    let matchInProgress = false;
    let hasRoadMatchedRoute = false;


    // =====================================================
    // HAVERSINE DISTANCE
    // =====================================================


    function distanceMeters(
      lat1,
      lon1,
      lat2,
      lon2
    ) {


      const R = 6371000;


      const dLat =
        (lat2 - lat1) *
        Math.PI / 180;


      const dLon =
        (lon2 - lon1) *
        Math.PI / 180;


      const a =

        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +

        Math.cos(
          lat1 * Math.PI / 180
        ) *

        Math.cos(
          lat2 * Math.PI / 180
        ) *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);


      const c =
        2 *
        Math.atan2(
          Math.sqrt(a),
          Math.sqrt(1 - a)
        );


      return R * c;

    }


    // =====================================================
    // CLEAN GPS ROUTE
    // =====================================================


    function buildCleanRoute(
      latitudeData,
      longitudeData
    ) {


      const longitudeMap =
        new Map();


      // Match longitude using timestamp

      longitudeData.forEach(
        item => {

          longitudeMap.set(
            item.ts,
            Number(item.value)
          );

        }
      );


      // Create timestamped GPS points

      const rawPoints = [];


      latitudeData.forEach(
        item => {


          const latitude =
            Number(item.value);


          const longitude =
            longitudeMap.get(
              item.ts
            );


          if (

            Number.isFinite(latitude) &&

            Number.isFinite(longitude) &&

            latitude >= -90 &&

            latitude <= 90 &&

            longitude >= -180 &&

            longitude <= 180

          ) {


            rawPoints.push({

              lat: latitude,

              lon: longitude,

              ts: Number(item.ts)

            });

          }

        }
      );


      // Sort chronologically

      rawPoints.sort(
        (a, b) =>
          a.ts - b.ts
      );


      if (rawPoints.length === 0) {

        return [];

      }


      // First point is always accepted

      const cleanPoints = [
        rawPoints[0]
      ];


      for (
        let i = 1;
        i < rawPoints.length;
        i++
      ) {


        const previous =
          cleanPoints[
            cleanPoints.length - 1
          ];


        const current =
          rawPoints[i];


        const distance =
          distanceMeters(

            previous.lat,
            previous.lon,

            current.lat,
            current.lon

          );


        const timeSeconds =
          Math.max(

            (current.ts -
             previous.ts) / 1000,

            1

          );


        const calculatedSpeed =
          (distance / timeSeconds) *
          3.6;


        // Ignore impossible GPS jump

        if (
          calculatedSpeed >
          MAX_SPEED_KMPH
        ) {

          console.log(
            "Ignored GPS jump:",
            calculatedSpeed.toFixed(1),
            "km/h"
          );

          continue;

        }


        // Ignore tiny stationary GPS noise

        if (
          distance <
          MIN_MOVEMENT_METERS
        ) {

          continue;

        }


        cleanPoints.push(
          current
        );

      }


      return cleanPoints;

    }


    // =====================================================
    // SNAP GPS TRACE TO ROADS USING OSRM MATCH API
    // =====================================================

    async function snapRouteToRoad(cleanPoints) {
      if (!cleanPoints || cleanPoints.length < 2 || matchInProgress) {
        return;
      }

      const latestTs = cleanPoints[cleanPoints.length - 1].ts;
      const now = Date.now();

      // Don't send the same trace repeatedly. Refresh at most every 30 seconds.
      if (
        latestTs === lastMatchedLatestTs ||
        (lastMatchAt > 0 && now - lastMatchAt < 30000)
      ) {
        return;
      }

      // OSRM's public demo service is not intended for high-volume use.
      // Match the most recent 100 points only.
      const points = cleanPoints.slice(-100);
      if (points.length < 2) return;

      matchInProgress = true;
      lastMatchAt = now;

      try {
        const coordinates = points
          .map(point => `${point.lon},${point.lat}`)
          .join(";");

        const timestamps = points
          .map(point => Math.floor(point.ts / 1000))
          .join(";");

        const radiuses = points.map(() => "20").join(";");

        const matchUrl =
          "https://router.project-osrm.org/match/v1/driving/" +
          coordinates +
          "?geometries=geojson&overview=full&tidy=true&gaps=split" +
          "&timestamps=" + timestamps +
          "&radiuses=" + radiuses;

        const response = await fetch(matchUrl);
        if (!response.ok) {
          throw new Error("OSRM match HTTP " + response.status);
        }

        const result = await response.json();

        if (
          result.code !== "Ok" ||
          !Array.isArray(result.matchings) ||
          result.matchings.length === 0
        ) {
          throw new Error("OSRM could not match this GPS trace");
        }

        // A trace can be split into several matchings when GPS points have gaps.
        // Keep each matched section as a separate Leaflet line so gaps aren't
        // drawn as artificial straight connectors.
        const snappedSections = result.matchings
          .filter(m => m.geometry && Array.isArray(m.geometry.coordinates))
          .map(m =>
            m.geometry.coordinates.map(([lon, lat]) => [lat, lon])
          )
          .filter(section => section.length > 1);

        if (snappedSections.length === 0) {
          throw new Error("No matched road geometry returned");
        }

        routeLine.setLatLngs(snappedSections);
        lastMatchedLatestTs = latestTs;
        hasRoadMatchedRoute = true;

        document.getElementById("status").textContent =
          "Road-matched route • latest " + points.length + " GPS points";
      } catch (error) {
        console.warn("Road matching unavailable; showing GPS trace instead:", error);

        // Fall back to the actual GPS trace if OSRM is unavailable.
        if (!hasRoadMatchedRoute) {
          routeLine.setLatLngs(
            points.map(point => [point.lat, point.lon])
          );
        }
      } finally {
        matchInProgress = false;
      }
    }


    // =====================================================
    // GET TELEMETRY
    // =====================================================


    async function getTelemetry() {


      try {


        const endTs =
          Date.now();


        // Last 24 hours

        const startTs =
          endTs -
          (24 * 60 * 60 * 1000);


        const url =

          THINGSBOARD_URL +

          "/api/plugins/telemetry/DEVICE/" +

          DEVICE_ID +

          "/values/timeseries" +

          "?keys=latitude,longitude,speed,satellites" +

          "&startTs=" +

          startTs +

          "&endTs=" +

          endTs +

          "&limit=10000" +

          "&agg=NONE" +

          "&orderBy=ASC";


        const response =
          await fetch(
            url,
            {

              headers: {

                "X-Authorization":
                  "ApiKey " + API_KEY

              }

            }
          );


        if (!response.ok) {

          throw new Error(
            "ThingsBoard error: " +
            response.status
          );

        }


        const data =
          await response.json();


        console.log(
          "ThingsBoard data:",
          data
        );


        // =================================================
        // GPS DATA
        // =================================================


        const latitudeData =
          data.latitude || [];


        const longitudeData =
          data.longitude || [];


        if (

          latitudeData.length === 0 ||

          longitudeData.length === 0

        ) {


          document.getElementById(
            "status"
          ).textContent =
            "Waiting for GPS data...";


          return;

        }


        // =================================================
        // BUILD CLEAN ROUTE
        // =================================================


        const cleanPoints =
          buildCleanRoute(

            latitudeData,

            longitudeData

          );


        if (
          cleanPoints.length === 0
        ) {

          return;

        }


        // =================================================
        // DRAW GPS TRACE / UPDATE ROAD-MATCHED TRACE
        // =================================================

        // Show the raw trace immediately on first load; OSRM replaces it
        // with road-matched geometry when a successful match is returned.
        if (!hasRoadMatchedRoute) {
          routeLine.setLatLngs(
            cleanPoints.map(point => [point.lat, point.lon])
          );
        }

        // This runs in the background so the live marker can keep updating.
        snapRouteToRoad(cleanPoints);


        // =================================================
        // LATEST VALID LOCATION
        // =================================================


        const latest =
          cleanPoints[
            cleanPoints.length - 1
          ];


        const latestLatitude =
          latest.lat;


        const latestLongitude =
          latest.lon;


        // =================================================
        // UPDATE MARKER
        // =================================================


        const latestPosition = [

          latestLatitude,

          latestLongitude

        ];


        if (marker === null) {


          marker =
            L.marker(
              latestPosition
            )
            .addTo(map)
            .bindPopup(

              "<b>📍 GPS Location</b><br>" +

              "Latitude: " +

              latestLatitude.toFixed(6) +

              "<br>" +

              "Longitude: " +

              latestLongitude.toFixed(6)

            );


        } else {


          marker.setLatLng(
            latestPosition
          );


          marker.setPopupContent(

            "<b>📍 GPS Location</b><br>" +

            "Latitude: " +

            latestLatitude.toFixed(6) +

            "<br>" +

            "Longitude: " +

            latestLongitude.toFixed(6)

          );

        }


        // =================================================
        // MOVE MAP
        // =================================================


        if (firstLocation) {


          map.setView(
            latestPosition,
            18
          );


          firstLocation = false;


        } else {


          map.panTo(
            latestPosition
          );

        }


        // =================================================
        // UPDATE STATUS
        // =================================================


        document.getElementById(
          "gpsStatus"
        ).textContent =
          "LIVE";


        document.getElementById(
          "gpsStatus"
        ).style.color =
          "lime";


        document.getElementById(
          "latitude"
        ).textContent =
          latestLatitude.toFixed(6);


        document.getElementById(
          "longitude"
        ).textContent =
          latestLongitude.toFixed(6);


        // =================================================
        // SPEED
        // =================================================


        if (

          data.speed &&

          data.speed.length

        ) {


          const latestSpeed =
            Number(

              data.speed[
                data.speed.length - 1
              ].value

            );


          let displaySpeed =
            latestSpeed;


          // Remove GPS speed noise

          if (

            !Number.isFinite(
              displaySpeed
            ) ||

            displaySpeed <
            STATIONARY_SPEED_KMPH

          ) {

            displaySpeed = 0;

          }


          document.getElementById(
            "speed"
          ).textContent =

            displaySpeed.toFixed(2) +

            " km/h";

        }


        // =================================================
        // SATELLITES
        // =================================================


        if (

          data.satellites &&

          data.satellites.length

        ) {


          const latestSatellites =
            Number(

              data.satellites[
                data.satellites.length - 1
              ].value

            );


          document.getElementById(
            "satellites"
          ).textContent =

            Number.isFinite(
              latestSatellites
            )

              ? latestSatellites

              : "--";

        }


        // =================================================
        // LAST UPDATE
        // =================================================


        document.getElementById(
          "updateTime"
        ).textContent =

          new Date()
            .toLocaleTimeString();


        // =================================================
        // GOOGLE MAPS
        // =================================================


        document.getElementById(
          "googleMaps"
        ).href =

          "https://www.google.com/maps?q=" +

          latestLatitude +

          "," +

          latestLongitude;


        // =================================================
        // STATUS MESSAGE
        // =================================================


        if (!hasRoadMatchedRoute) {
          document.getElementById(
            "status"
          ).textContent =
            "GPS connected • " +
            cleanPoints.length +
            " clean route points • matching roads…";
        }


      }


      catch (error) {


        console.error(
          "ThingsBoard error:",
          error
        );


        document.getElementById(
          "status"
        ).textContent =

          "ThingsBoard connection error";


        document.getElementById(
          "gpsStatus"
        ).textContent =
          "ERROR";


        document.getElementById(
          "gpsStatus"
        ).style.color =
          "red";

      }

    }


    // =====================================================
    // START
    // =====================================================


    getTelemetry();


    // Refresh every 5 seconds

    setInterval(
      getTelemetry,
      5000
    );


  </script>

</body>

</html>
