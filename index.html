<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ESP32 GPS Tracker</title>


  <!-- Leaflet -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >


  <style>

    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: #111;

      color: white;

      text-align: center;

    }


    h1 {

      padding: 15px;

      margin: 0;

    }


    #status {

      padding: 10px;

      font-size: 18px;

    }


    #map {

      height: 70vh;

      width: 100%;

    }


    .details {

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 10px;

      padding: 15px;

    }


    .box {

      background: #222;

      padding: 12px;

      border-radius: 8px;

    }


    .label {

      font-size: 13px;

      color: #aaa;

    }


    .value {

      font-size: 18px;

      font-weight: bold;

      margin-top: 5px;

    }


    #googleMaps {

      display: inline-block;

      margin: 15px;

      padding: 12px 20px;

      background: #4285F4;

      color: white;

      text-decoration: none;

      border-radius: 8px;

      font-weight: bold;

    }


    #googleMaps:hover {

      opacity: 0.85;

    }

  </style>

</head>


<body>


  <h1>📍 ESP32 GPS Tracker</h1>


  <div id="status">

    Connecting to ThingsBoard...

  </div>


  <div id="map"></div>


  <div class="details">


    <div class="box">

      <div class="label">

        Status

      </div>

      <div
        class="value"
        id="gpsStatus"
      >

        --

      </div>

    </div>


    <div class="box">

      <div class="label">

        Speed

      </div>

      <div
        class="value"
        id="speed"
      >

        --

      </div>

    </div>


    <div class="box">

      <div class="label">

        Satellites

      </div>

      <div
        class="value"
        id="satellites"
      >

        --

      </div>

    </div>


    <div class="box">

      <div class="label">

        Latitude

      </div>

      <div
        class="value"
        id="latitude"
      >

        --

      </div>

    </div>


    <div class="box">

      <div class="label">

        Longitude

      </div>

      <div
        class="value"
        id="longitude"
      >

        --

      </div>

    </div>


    <div class="box">

      <div class="label">

        Last Update

      </div>

      <div
        class="value"
        id="updateTime"
      >

        --

      </div>

    </div>

  </div>


  <a
    id="googleMaps"
    href="#"
    target="_blank"
  >

    Open in Google Maps

  </a>


  <!-- Leaflet -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>


  <script>


    // =====================================================
    // THINGSBOARD SETTINGS
    // =====================================================


    const THINGSBOARD_URL =
      "https://thingsboard.cloud";


    // Your device Entity ID

    const DEVICE_ID =
      "512351b0-b9be-11f1-8553-d97f9e4a8828";


    // =====================================================
    // IMPORTANT
    // =====================================================
    // Create a ThingsBoard REST API key and put it here.
    //
    // DO NOT use the ESP32 device access token here.
    //
    // Example:
    //
    // const API_KEY = "YOUR_API_KEY";
    // =====================================================


    const API_KEY =
      "tb_MmtobP-6M4HXI0Qu_u5uKyi-GVd7QTdlPsUa0j0Wo9QIiuL6tJ3pKxBT0Q-RYTSZVPqn-QMm6B-dpqpSKaM-Dw";


    // =====================================================
    // MAP
    // =====================================================


    const map =
      L.map("map")
        .setView(
          [10.156453, 76.258558],
          15
        );


    L.tileLayer(

      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

      {

        maxZoom: 19,

        attribution:
          "&copy; OpenStreetMap contributors"

      }

    ).addTo(map);


    // GPS marker

    let marker = null;


    // Route line

    let routeLine =
      L.polyline(
        [],
        {
          weight: 5
        }
      ).addTo(map);


    let firstLocation = true;


    // =====================================================
    // GET TELEMETRY HISTORY
    // =====================================================


    async function getTelemetry() {


      try {


        const endTs =
          Date.now();


        // Last 24 hours

        const startTs =
          endTs -
          (24 * 60 * 60 * 1000);


        const url =

          THINGSBOARD_URL +

          "/api/plugins/telemetry/DEVICE/" +

          DEVICE_ID +

          "/values/timeseries" +

          "?keys=latitude,longitude,speed,satellites" +

          "&startTs=" +

          startTs +

          "&endTs=" +

          endTs +

          "&limit=10000" +

          "&agg=NONE" +

          "&orderBy=ASC";


        const response =

          await fetch(
            url,
            {

              headers: {

                "X-Authorization":
                  "ApiKey " + API_KEY

              }

            }
          );


        if (!response.ok) {

          throw new Error(
            "ThingsBoard error: " +
            response.status
          );

        }


        const data =
          await response.json();


        console.log(
          "ThingsBoard data:",
          data
        );


        // =================================================
        // GET GPS ARRAYS
        // =================================================


        const latitudeData =
          data.latitude || [];


        const longitudeData =
          data.longitude || [];


        if (

          latitudeData.length === 0 ||

          longitudeData.length === 0

        ) {

          document.getElementById(
            "status"
          ).textContent =
            "Waiting for GPS data...";

          return;

        }


        // =================================================
        // CREATE ROUTE
        // =================================================


        const points = [];


        const longitudeMap =
          new Map();


        // Store longitude by timestamp

        longitudeData.forEach(
          item => {

            longitudeMap.set(
              item.ts,
              Number(item.value)
            );

          }
        );


        latitudeData.forEach(
          item => {


            const latitude =
              Number(item.value);


            const longitude =
              longitudeMap.get(
                item.ts
              );


            if (

              Number.isFinite(latitude) &&

              Number.isFinite(longitude)

            ) {

              points.push(
                [
                  latitude,
                  longitude
                ]
              );

            }

          }
        );


        if (points.length === 0) {

          return;

        }


        // =================================================
        // DRAW ROUTE
        // =================================================


        routeLine.setLatLngs(
          points
        );


        // =================================================
        // LATEST LOCATION
        // =================================================


        const latest =
          points[
            points.length - 1
          ];


        const latestLatitude =
          latest[0];


        const latestLongitude =
          latest[1];


        // =================================================
        // UPDATE MARKER
        // =================================================


        if (marker === null) {


          marker =
            L.marker(latest)
              .addTo(map)
              .bindPopup(

                "<b>📍 GPS Location</b><br>" +

                "Latitude: " +

                latestLatitude.toFixed(6) +

                "<br>" +

                "Longitude: " +

                latestLongitude.toFixed(6)

              );


        } else {


          marker.setLatLng(
            latest
          );


          marker.setPopupContent(

            "<b>📍 GPS Location</b><br>" +

            "Latitude: " +

            latestLatitude.toFixed(6) +

            "<br>" +

            "Longitude: " +

            latestLongitude.toFixed(6)

          );

        }


        // =================================================
        // MOVE MAP
        // =================================================


        if (firstLocation) {


          map.setView(
            latest,
            18
          );


          firstLocation = false;


        } else {


          map.panTo(
            latest
          );

        }


        // =================================================
        // UPDATE GPS INFORMATION
        // =================================================


        document.getElementById(
          "gpsStatus"
        ).textContent =
          "LIVE";


        document.getElementById(
          "gpsStatus"
        ).style.color =
          "lime";


        document.getElementById(
          "latitude"
        ).textContent =
          latestLatitude.toFixed(6);


        document.getElementById(
          "longitude"
        ).textContent =
          latestLongitude.toFixed(6);


        // =================================================
        // SPEED
        // =================================================


        if (
          data.speed &&
          data.speed.length
        ) {


          const latestSpeed =
            Number(
              data.speed[
                data.speed.length - 1
              ].value
            );


          document.getElementById(
            "speed"
          ).textContent =

            Number.isFinite(
              latestSpeed
            )

              ? latestSpeed.toFixed(2) +
                " km/h"

              : "--";

        }


        // =================================================
        // SATELLITES
        // =================================================


        if (
          data.satellites &&
          data.satellites.length
        ) {


          const latestSatellites =
            Number(
              data.satellites[
                data.satellites.length - 1
              ].value
            );


          document.getElementById(
            "satellites"
          ).textContent =

            Number.isFinite(
              latestSatellites
            )

              ? latestSatellites

              : "--";

        }


        // =================================================
        // TIME
        // =================================================


        document.getElementById(
          "updateTime"
        ).textContent =

          new Date()
            .toLocaleTimeString();


        // =================================================
        // GOOGLE MAPS
        // =================================================


        document.getElementById(
          "googleMaps"
        ).href =

          "https://www.google.com/maps?q=" +

          latestLatitude +

          "," +

          latestLongitude;


        document.getElementById(
          "status"
        ).textContent =

          "GPS connected • " +

          points.length +

          " route points";


      }


      catch (error) {


        console.error(
          "ThingsBoard error:",
          error
        );


        document.getElementById(
          "status"
        ).textContent =

          "ThingsBoard connection error";


        document.getElementById(
          "gpsStatus"
        ).textContent =
          "ERROR";


        document.getElementById(
          "gpsStatus"
        ).style.color =
          "red";

      }

    }


    // =====================================================
    // START
    // =====================================================


    getTelemetry();


    // Refresh every 5 seconds

    setInterval(
      getTelemetry,
      5000
    );


  </script>


</body>

</html>
